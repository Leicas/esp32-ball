; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:feather]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitm-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
framework = arduino
upload_protocol = esptool
build_src_filter = +<*> -<a7_bringup/>
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-std=gnu++17
lib_deps = 
	adafruit/Adafruit BusIO    @ ^1.16.2
	adafruit/Adafruit NeoPixel @ ^1.12.3
	adafruit/Adafruit BNO08x@^1.2.3

[env:hbridge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitm-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
board_upload.flash_size = 8MB
framework = arduino
upload_protocol = esptool
build_src_filter = +<*> -<a7_bringup/>
build_flags = 
	-DHBRIDGE
	-DARDUINO_ESP32C6_DEV
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-std=gnu++17
lib_deps = 
	adafruit/Adafruit BusIO    @ ^1.16.2
	adafruit/Adafruit BNO08x@^1.2.3

; ── Rolling Stone A7 custom PCB — rolling ball / marbles simulation ─────────
; Flash: pio run -e a7_ball --target upload --upload-port COMxx   (keep still at boot: gyro cal)
[env:a7_ball]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitm-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
build_src_filter = +<*> -<a7_bringup/>
build_unflags = -Os
build_flags =
	-DA7_BOARD
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-std=gnu++17
	-O2 ; the 2 kHz audio task is CPU-bound on a core with no FPU

; ── Rolling Stone A7 custom PCB — hardware bring-up / self-test only ────────
[env:a7_ball_threeway]
extends = env:a7_ball
board_build.partitions = huge_app.csv
build_flags = ${env:a7_ball.build_flags} -DA7_THREEWAY

; Flash: pio run -e a7_bringup --target upload --upload-port COMxx
[env:a7_bringup]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitm-1
board_build.mcu = esp32c6
board_build.f_cpu = 160000000L
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
build_src_filter = -<*> +<a7_bringup/>
build_flags = 
	-DA7_BRINGUP
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-std=gnu++17
lib_deps = 
	adafruit/Adafruit NeoPixel @ ^1.12.3
