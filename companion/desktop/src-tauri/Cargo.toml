[package]
name = "rolling-stone"
version = "0.1.0"
description = "Rolling Stone desktop companion"
authors = ["Rolling Stone"]
edition = "2021"

[lib]
name = "rolling_stone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serialport = { version = "4", default-features = false }
tauri = { version = "2", features = [] }
